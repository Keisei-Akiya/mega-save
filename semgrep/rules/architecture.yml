# Architecture boundaries for mega-save (FP storage repository).

rules:
  - id: mega-save.no-rclone-command-outside-interpreter
    message: >-
      Do not spawn the rclone binary outside storage/src/rclone.rs.
      Use MegaRepository / Op + interpret instead.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "**/*.rs"
      exclude:
        - "**/storage/src/rclone.rs"
        - "**/target/**"
    pattern-either:
      - pattern: Command::new("rclone")
      - pattern: std::process::Command::new("rclone")
      - pattern: tokio::process::Command::new("rclone")

  - id: mega-save.site-no-tokio-process
    message: >-
      Site modules must not use tokio::process except ytdlp.rs / curl_get.rs.
      MEGA I/O belongs in mega-save-storage.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "**/cli/src/x/**/*.rs"
        - "**/cli/src/pornavhd/**/*.rs"
      exclude:
        - "**/target/**"
        - "**/semgrep/**"
        - "**/ytdlp.rs"
        - "**/curl_get.rs"
    pattern: tokio::process::$ANY

  - id: mega-save.site-no-std-process-command
    message: >-
      Site modules must not use std::process::Command. MEGA I/O belongs in mega-save-storage.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "**/cli/src/x/**/*.rs"
        - "**/cli/src/pornavhd/**/*.rs"
      exclude:
        - "**/target/**"
        - "**/semgrep/**"
        - "**/ytdlp.rs"
        - "**/curl_get.rs"
    pattern-either:
      - pattern: std::process::Command
      - pattern: std::process::Command::new($X)
      - pattern: std::process::Command::$M

  - id: mega-save.site-no-low-level-storage-interpret
    message: >-
      Site modules should call MegaRepository, not interpret/run_program directly.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "**/cli/src/**/*.rs"
      exclude:
        - "**/target/**"
        - "**/semgrep/**"
        - "**/storage/**"
    pattern-either:
      - pattern: mega_save_storage::interpret(...)
      - pattern: mega_save_storage::run_program(...)
      - pattern: interpret($R, $O)
      - pattern: run_program($R, $P)

  - id: mega-save.site-no-mod-rclone
    message: >-
      Do not reintroduce a local rclone module in the CLI.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "**/cli/src/**/*.rs"
      exclude:
        - "**/semgrep/**"
    pattern-either:
      - pattern: mod rclone;
      - pattern: mod rclone { ... }

  - id: mega-save.pure-path-op-no-process
    message: >-
      storage path/op/error modules must stay pure (no process spawn).
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "**/storage/src/path.rs"
        - "**/storage/src/op.rs"
        - "**/storage/src/error.rs"
    pattern-either:
      - pattern: tokio::process::$X
      - pattern: std::process::$X
      - pattern: Command::new($X)
      - pattern: std::process::Command::new($X)
      - pattern: tokio::process::Command::new($X)

  - id: mega-save.repository-no-direct-command
    message: >-
      MegaRepository must not spawn processes; compose Op only.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "**/storage/src/repository.rs"
    pattern-either:
      - pattern: Command::new($X)
      - pattern: std::process::Command::new($X)
      - pattern: tokio::process::Command::new($X)

  - id: mega-save.tool-boundary-no-rclone
    message: >-
      ytdlp.rs / curl_get.rs may spawn yt-dlp or curl only, never rclone.
    languages: [rust]
    severity: ERROR
    paths:
      include:
        - "**/ytdlp.rs"
        - "**/curl_get.rs"
    pattern-either:
      - pattern: Command::new("rclone")
      - pattern: tokio::process::Command::new("rclone")
      - pattern: std::process::Command::new("rclone")
